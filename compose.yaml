services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-myDesk}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mydesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mydesk:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-myDesk}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}
    ports:
      - "8080:8080"
    networks:
      - mydesk-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  mydesk-network:
    driver: bridge

volumes:
  postgres_data: